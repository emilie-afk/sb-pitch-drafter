[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Tell browsers and Netlify's CDN NEVER to cache the HTML page. This makes
# sure that whenever we update index.html on GitHub and Netlify redeploys,
# every visitor immediately gets the latest version, instead of getting
# yesterday's cached page.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
